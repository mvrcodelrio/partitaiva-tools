<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calcolo Ritenuta d'Acconto 20% – netto in fattura | Vanquish</title>
<meta name="description" content="Calcola la ritenuta d'acconto, il netto da incassare e il totale fattura con cassa previdenziale e IVA.">
<link rel="icon" href="vanquish-logo.webp">
<link rel="stylesheet" href="style.css"></head><body>
<header class="brand"><a href="index.html" aria-label="Vanquish"><img src="vanquish-logo.webp" alt="Vanquish" width="150" height="100"></a><span>Strumenti per Partita IVA e freelance</span></header>
<main>
<h1>Calcolo Ritenuta d'Acconto</h1>
<div class="card">
<label for="comp">Compenso (€)</label><input id="comp" type="number" min="0" step="0.01" value="1000">
<label for="cassa">Rivalsa/contributo cassa (%)</label><input id="cassa" type="number" min="0" step="0.01" value="4">
<label for="iva">IVA (%) – 0 se esente o forfettario</label><input id="iva" type="number" min="0" step="0.01" value="22">
<label for="rit">Ritenuta (%)</label><input id="rit" type="number" min="0" step="0.01" value="20">
<button id="go">Calcola</button>
<div class="res" id="out"></div>
</div>
<div class="ad" data-slot="mid"></div>
<p><small>La ritenuta si calcola sul compenso (e sulla rivalsa se prevista, salvo casi particolari), non sull'IVA. Schema indicativo.</small></p>
</main>
<footer>Vanquish · <a href="index.html">Home</a> · <a href="privacy.html">Privacy</a></footer>
<script>
const f=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
document.getElementById('go').onclick=()=>{
const c=+comp.value||0,rv=c*(+cassa.value/100),base=c+rv,iv=base*(+iva.value/100),tot=base+iv,rt=c*(+rit.value/100);
out.innerHTML=`<div><span>Compenso</span><b>${f(c)}</b></div><div><span>Rivalsa cassa</span><b>${f(rv)}</b></div><div><span>IVA</span><b>${f(iv)}</b></div><div><span>Totale fattura</span><b>${f(tot)}</b></div><div><span>Ritenuta d'acconto</span><b>− ${f(rt)}</b></div><div class="tot"><span>Netto da incassare</span><b>${f(tot-rt)}</b></div>`};
document.getElementById('go').click();
</script><script src="ads.js"></script></body></html>
