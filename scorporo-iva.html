<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorporo IVA e Calcolo IVA online – 22%, 10%, 4% | Vanquish</title>
<meta name="description" content="Scorpora l'IVA da un importo lordo o aggiungila a un netto. Aliquote 22%, 10%, 5% e 4%. Gratis e immediato.">
<link rel="icon" href="vanquish-logo.webp">
<link rel="stylesheet" href="style.css"></head><body>
<header class="brand"><a href="index.html" aria-label="Vanquish"><img src="vanquish-logo.webp" alt="Vanquish" width="150" height="100"></a><span>Strumenti per Partita IVA e freelance</span></header>
<main>
<h1>Scorporo e calcolo IVA</h1>
<div class="card">
<label for="imp">Importo (€)</label><input id="imp" type="number" min="0" step="0.01" value="122">
<label for="al">Aliquota IVA</label>
<select id="al"><option value="22">22%</option><option value="10">10%</option><option value="5">5%</option><option value="4">4%</option></select>
<label for="mode">Operazione</label>
<select id="mode"><option value="s">Scorporo (da lordo a netto)</option><option value="a">Aggiungi IVA (da netto a lordo)</option></select>
<button id="go">Calcola</button>
<div class="res" id="out"></div>
</div>
<div class="ad" data-slot="mid"></div>
<h2>Formule</h2>
<p><b>Scorporo:</b> imponibile = lordo ÷ (1 + aliquota). <b>Aggiunta:</b> lordo = netto × (1 + aliquota).</p>
</main>
<footer>Vanquish · <a href="index.html">Home</a> · <a href="privacy.html">Privacy</a></footer>
<script>
const f=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
document.getElementById('go').onclick=()=>{
const v=+imp.value||0,a=+al.value/100;let net,lor;
if(mode.value==='s'){lor=v;net=v/(1+a)}else{net=v;lor=v*(1+a)}
out.innerHTML=`<div><span>Imponibile (netto)</span><b>${f(net)}</b></div><div><span>IVA</span><b>${f(lor-net)}</b></div><div class="tot"><span>Totale (lordo)</span><b>${f(lor)}</b></div>`};
document.getElementById('go').click();
</script><script src="ads.js"></script></body></html>
